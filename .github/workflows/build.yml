name: Build & Release Potato AppImage

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore Potato.sln

    - name: Run Unit Tests
      run: dotnet test tests/Potato.Tests/Potato.Tests.csproj --no-restore --verbosity normal

    - name: Download appimagetool
      run: |
        curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
        chmod +x /tmp/appimagetool
        cd /tmp && ./appimagetool --appimage-extract
        sudo mv /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool
        sudo cp -r /tmp/squashfs-root/usr /usr/local/ 2>/dev/null || true

    - name: Publish Self-Contained Binary
      run: |
        mkdir -p build/Potato.AppDir/usr/bin
        dotnet publish src/Potato.UI/Potato.UI.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -o build/Potato.AppDir/usr/bin

    - name: Assemble AppDir
      run: |
        mkdir -p build/Potato.AppDir
        cat << 'EOF' > build/Potato.AppDir/potato.desktop
        [Desktop Entry]
        Type=Application
        Name=Potato
        GenericName=Steam Deployment Engine
        Comment=Modern Linux & Steam Deck Steam Suite
        Exec=Potato.UI %u
        Icon=potato
        Categories=Game;Utility;
        Terminal=false
        EOF

        if [ -f assets/potato.png ]; then
          cp assets/potato.png build/Potato.AppDir/potato.png
          cp assets/potato.png build/Potato.AppDir/.DirIcon
        else
          touch build/Potato.AppDir/potato.png
          touch build/Potato.AppDir/.DirIcon
        fi

        cat << 'EOF' > build/Potato.AppDir/AppRun
        #!/bin/sh
        SELF=$(readlink -f "$0")
        HERE=${SELF%/*}
        export PATH="${HERE}/usr/bin:${PATH}"
        exec "${HERE}/usr/bin/Potato.UI" "$@"
        EOF
        chmod +x build/Potato.AppDir/AppRun

    - name: Package AppImage
      run: |
        mkdir -p dist
        ARCH=x86_64 appimagetool build/Potato.AppDir dist/Potato-x86_64.AppImage

    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Potato-x86_64.AppImage
        path: dist/Potato-x86_64.AppImage

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Potato-x86_64.AppImage
        generate_release_notes: true

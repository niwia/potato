name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore Potato.sln

    - name: Build Solution
      run: dotnet build Potato.sln --no-restore -c Release

    - name: Run Test Suite
      run: dotnet test Potato.sln --no-build -c Release --verbosity normal

    - name: Publish Console Harness
      run: |
        dotnet publish src/Potato.Downloader.ConsoleHarness/Potato.Downloader.ConsoleHarness.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o publish/

    - name: Upload Console Harness Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Potato-Harness-linux-x64
        path: publish/
